name: pats_space
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  firebase_analytics: ^12.4.2
  firebase_app_check: ^0.4.5+2
  firebase_crashlytics: ^5.2.2
  cloud_firestore: ^6.6.0
  google_sign_in: ^7.2.0
  phosphor_flutter: ^2.1.0
  connectivity_plus: ^7.3.0
  audioplayers: ^6.7.1
  flutter_local_notifications: ^22.2.0
  google_mobile_ads: ^5.3.1
  purchases_flutter: ^9.15.1
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

# Temporary iOS workaround: 2.6.0 embeds objective_c.framework, whose current
# Flutter/Xcode build path can leave an invalid device signature.
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter_native_splash:
  color: "#FEFFFF"
  image: assets/images/ui/splash_character.png
  color_dark: "#FEFFFF"
  image_dark: assets/images/ui/splash_character.png
  android_12:
    color: "#FEFFFF"
    image: assets/images/ui/splash_character.png
    color_dark: "#FEFFFF"
    image_dark: assets/images/ui/splash_character.png
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon/app_icon.png
  adaptive_icon_background: "#FEFFFF"
  adaptive_icon_foreground: assets/images/app_icon/app_icon_foreground.png
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/audio/ambience/
    - assets/audio/alerts/
    - assets/images/
    - assets/images/focus_pairs/pair_01/
    - assets/images/focus_pairs/pair_02/
    - assets/images/focus_pairs/pair_03/
    - assets/images/focus_pairs/pair_04/
    - assets/images/focus_pairs/pair_05/
    - assets/images/focus_pairs/pair_06/
    - assets/images/focus/deep_focus/
    - assets/images/focus/stamps/character/
    - assets/images/onboarding/pat_talking/
    - assets/images/social_focus/background/
    - assets/images/social_focus/decor/
    - assets/images/social_focus/furniture/desks/
    - assets/images/social_focus/characters/reading/
    - assets/images/social_focus/characters/writing/
    - assets/images/social_focus/characters/coding/
    - assets/images/social_focus/characters/sleeping/
    - assets/images/social_focus/accessories/
    - assets/images/social_focus/placeholders/
    - assets/images/garden/backgrounds/
    - assets/images/garden/pots/default/
    - assets/images/garden/pots/
    - assets/images/garden/decorations/
    - assets/images/garden/plants/default/stages/
    - assets/images/garden/plants/tulip/stages/
    - assets/images/garden/plants/clover/stages/
    - assets/images/garden/plants/sunflower/stages/
    - assets/images/garden/plants/hanging_flower/stages/
    - assets/images/garden/plants/cherryblossom/stages/
    - assets/images/garden/plants/strawberry/stages/
    - assets/images/garden/ui/
    - assets/images/ui/
